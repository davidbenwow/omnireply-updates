<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>OmniReply Update Service</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f8fb;
        --panel: #ffffff;
        --text: #161b22;
        --muted: #5d6775;
        --border: #d9dee7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: min(480px, calc(100% - 32px));
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--panel);
      }

      img {
        display: block;
        width: min(220px, 70%);
        height: auto;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./assets/omniscriptum-logo-stifte-1c.png" alt="OmniScriptum">
      <h1>OmniReply update service</h1>
      <p>This page hosts extension update files for Thunderbird.</p>
    </main>
  </body>
</html>
